<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>स्मृति</title>
<meta name="description" content="स्मृति — बोलकर याद रखें, बोलकर पूछें">
<meta name="theme-color" content="#2F6F62">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7EF;
    --surface: #FFFFFF;
    --ink: #2B2118;
    --ink-soft: #6B5D4F;
    --teal: #2F6F62;
    --teal-dark: #235148;
    --amber: #C97A2B;
    --amber-dark: #9E5E1E;
    --rose: #B5473F;
    --line: #E7DFCF;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201A12;
      --surface: #2B241A;
      --ink: #F4ECDD;
      --ink-soft: #C9BBA5;
      --line: #4A3F2E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #201A12;
    --surface: #2B241A;
    --ink: #F4ECDD;
    --ink-soft: #C9BBA5;
    --line: #4A3F2E;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Hind', 'Atkinson Hyperlegible', -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    min-height: 100vh;
    position: relative;
  }
  .lang-switch {
    position: absolute;
    top: 28px;
    right: 20px;
    display: flex;
    border: 2px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    background: var(--surface);
  }
  .lang-switch button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 7px 14px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .lang-switch button.active {
    background: var(--teal);
    color: #fff;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
    padding-top: 44px;
  }
  header h1 {
    font-size: 30px;
    margin: 0 0 4px;
    font-weight: 700;
  }
  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 17px;
  }
  .big-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 26px 24px;
    border: none;
    border-radius: 20px;
    font-family: inherit;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    margin-bottom: 18px;
    text-align: left;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
  }
  .big-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .big-btn .emoji { font-size: 40px; line-height: 1; flex-shrink: 0; }
  .btn-remember { background: var(--teal); }
  .btn-find { background: var(--amber); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .recent-title {
    font-size: 18px;
    color: var(--ink-soft);
    margin: 30px 0 12px;
    font-weight: 700;
  }
  .memory-item {
    font-size: 19px;
    line-height: 1.5;
    padding: 6px 0;
  }
  .memory-item button {
    background: none;
    border: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 19px;
    text-align: left;
    cursor: pointer;
    padding: 0;
    width: 100%;
  }
  .memory-date {
    display: block;
    font-size: 15px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .empty-msg {
    color: var(--ink-soft);
    font-size: 18px;
    text-align: center;
    padding: 20px 0;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .back-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 19px;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 8px 0 20px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-box {
    text-align: center;
    padding: 30px 10px;
  }
  .mic-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    margin: 10px auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    color: #fff;
  }
  .mic-circle.remember { background: var(--teal); }
  .mic-circle.find { background: var(--amber); }
  .mic-circle.listening { animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,111,98,0.35); }
    70% { box-shadow: 0 0 0 24px rgba(47,111,98,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,111,98,0); }
  }
  .mic-circle.find.listening { animation-name: pulseAmber; }
  @keyframes pulseAmber {
    0% { box-shadow: 0 0 0 0 rgba(201,122,43,0.35); }
    70% { box-shadow: 0 0 0 24px rgba(201,122,43,0); }
    100% { box-shadow: 0 0 0 0 rgba(201,122,43,0); }
  }
  .status-text {
    font-size: 21px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  textarea, input[type=text] {
    width: 100%;
    font-family: inherit;
    font-size: 20px;
    padding: 16px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    resize: vertical;
    margin-bottom: 16px;
  }
  .action-row {
    display: flex;
    gap: 12px;
  }
  .action-row button {
    flex: 1;
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    padding: 16px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
  }
  .save-btn { background: var(--teal); }
  .search-btn { background: var(--amber); }
  .cancel-btn { background: transparent; color: var(--ink-soft); border: 2px solid var(--line) !important; }

  .result-box {
    background: var(--surface);
    border: 2px solid var(--teal);
    border-radius: 18px;
    padding: 24px;
    font-size: 22px;
    line-height: 1.6;
    margin-top: 10px;
  }
  .result-box .rdate {
    display: block;
    margin-top: 10px;
    font-size: 17px;
    color: var(--ink-soft);
  }
  .no-support {
    font-size: 16px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 10px;
  }
  .delete-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: var(--rose);
    font-size: 16px;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- होम स्क्रीन / Home screen -->
  <div class="screen active" id="home">
    <div class="lang-switch">
      <button id="langBtnHi" onclick="setLang('hi')">हिं</button>
      <button id="langBtnEn" onclick="setLang('en')">EN</button>
    </div>
    <header>
      <h1 data-i18n="appName"></h1>
      <p data-i18n="appTagline"></p>
    </header>

    <button class="big-btn btn-remember" onclick="goTo('remember')">
      <span class="emoji">🎙️</span> <span data-i18n="btnRemember"></span>
    </button>
    <button class="big-btn btn-find" onclick="goTo('find')">
      <span class="emoji">🔍</span> <span data-i18n="btnFind"></span>
    </button>

    <div class="recent-title" data-i18n="recentTitle"></div>
    <div id="recentList"></div>
  </div>

  <!-- याद रखने की स्क्रीन / Remember screen -->
  <div class="screen" id="remember">
    <button class="back-btn" onclick="goTo('home')">← <span data-i18n="back"></span></button>
    <div class="status-box">
      <div class="mic-circle remember" id="rememberMic">🎙️</div>
      <div class="status-text" id="rememberStatus" data-i18n="rememberPrompt"></div>
    </div>
    <textarea id="rememberText" rows="3" data-i18n-placeholder="rememberPlaceholder"></textarea>
    <div class="action-row">
      <button class="cancel-btn" onclick="clearRemember()" data-i18n="clear"></button>
      <button class="save-btn" onclick="saveMemory()" data-i18n="save"></button>
    </div>
    <p class="no-support" id="rememberNoSupport" style="display:none" data-i18n="noSupport"></p>
  </div>

  <!-- खोजने की स्क्रीन / Find screen -->
  <div class="screen" id="find">
    <button class="back-btn" onclick="goTo('home')">← <span data-i18n="back"></span></button>
    <div class="status-box">
      <div class="mic-circle find" id="findMic">🔍</div>
      <div class="status-text" id="findStatus" data-i18n="findPrompt"></div>
    </div>
    <input type="text" id="findText" data-i18n-placeholder="findPlaceholder">
    <div class="action-row">
      <button class="cancel-btn" onclick="clearFind()" data-i18n="clear"></button>
      <button class="search-btn" onclick="doSearch()" data-i18n="searchBtn"></button>
    </div>
    <p class="no-support" id="findNoSupport" style="display:none" data-i18n="noSupport"></p>
    <div id="findResult"></div>
  </div>

  <!-- सभी यादें स्क्रीन / All memories screen -->
  <div class="screen" id="all">
    <button class="back-btn" onclick="goTo('home')">← <span data-i18n="back"></span></button>
    <div class="recent-title" style="margin-top:0" data-i18n="allTitle"></div>
    <div id="allList"></div>
  </div>

</div>

<script>
const STORAGE_KEY = 'smriti.memories';
const LANG_KEY = 'smriti.lang';

const I18N = {
  hi: {
    htmlLang: 'hi',
    speechLang: 'hi-IN',
    appName: 'स्मृति',
    appTagline: 'बटन दबाएं और बस बोलें',
    btnRemember: 'कुछ याद रखें',
    btnFind: 'कुछ खोजें',
    recentTitle: 'हाल ही में याद किया',
    allTitle: 'जो कुछ भी मुझे याद है',
    back: 'वापस',
    rememberPrompt: 'माइक दबाएं और बताएं कि क्या याद रखना है',
    rememberPlaceholder: 'उदाहरण: मैंने चाबियां रसोई की दराज़ में रखीं',
    findPrompt: 'माइक दबाएं और पूछें कि कोई चीज़ कहाँ है',
    findPlaceholder: 'उदाहरण: चाबियां कहाँ हैं',
    clear: 'मिटाएं',
    save: 'सेव करें',
    searchBtn: 'खोजें',
    noSupport: 'इस ब्राउज़र में आवाज़ इनपुट उपलब्ध नहीं है — कृपया ऊपर बॉक्स में टाइप करें।',
    listening: 'सुन रहा हूं...',
    heard: 'मिल गया — नीचे जांचें और सेव करें',
    heardFind: 'यह मिला',
    notUnderstood: 'समझ नहीं आया — फिर से कोशिश करें या टाइप करें',
    savedStatus: 'सेव हो गया!',
    savedSpeech: 'सेव हो गया। ',
    emptyRecent: 'अभी कुछ भी सेव नहीं है। पहली चीज़ जोड़ने के लिए "कुछ याद रखें" दबाएं।',
    emptyAll: 'अभी कुछ भी सेव नहीं है।',
    viewAll: (n) => `जो कुछ भी मुझे याद है वह देखें (${n})`,
    deleteAll: 'सब कुछ मिटाएं',
    confirmDeleteAll: 'जो कुछ भी आपने याद रखा है उसे मिटाएं? इसे वापस नहीं लाया जा सकता।',
    recallPrefix: 'मुझे यह याद है: ',
    recallSince: (d) => `। मुझे यह ${d} से याद है।`,
    notFound: 'मुझे इसके बारे में अभी कुछ याद नहीं है। क्या आप "कुछ याद रखें" से इसे जोड़ना चाहेंगी?',
    notFoundSpeech: 'मुझे इसके बारे में अभी कुछ याद नहीं है।',
    months: ["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"],
    stopwords: ['मैंने','मैं','है','हैं','था','थी','थे','में','पर','को','का','की','के','यह','वह','कहाँ','कहां','कुछ','रखा','रखी','रखे','रख','रखें','याद','ढूंढें','ढूंढो','खोजें','खोजो','कि','से','और','भी','हो','हूं','हूँ','कहा','गया','गई','थीं','उस','इस']
  },
  en: {
    htmlLang: 'en',
    speechLang: 'en-IN',
    appName: 'Smriti',
    appTagline: 'Press a button and just speak',
    btnRemember: 'Remember something',
    btnFind: 'Find something',
    recentTitle: 'Recently remembered',
    allTitle: 'Everything I remember',
    back: 'Back',
    rememberPrompt: 'Press the mic and say what to remember',
    rememberPlaceholder: 'Example: I put the keys in the kitchen drawer',
    findPrompt: 'Press the mic and ask where something is',
    findPlaceholder: 'Example: Where are the keys',
    clear: 'Clear',
    save: 'Save',
    searchBtn: 'Search',
    noSupport: 'Voice input is not available in this browser — please type in the box above.',
    listening: 'Listening...',
    heard: 'Got it — check below and save',
    heardFind: 'Found it',
    notUnderstood: "Didn't catch that — try again or type it",
    savedStatus: 'Saved!',
    savedSpeech: 'Saved. ',
    emptyRecent: 'Nothing saved yet. Press "Remember something" to add the first one.',
    emptyAll: 'Nothing saved yet.',
    viewAll: (n) => `See everything I remember (${n})`,
    deleteAll: 'Delete everything',
    confirmDeleteAll: 'Delete everything you remember? This cannot be undone.',
    recallPrefix: 'I remember this: ',
    recallSince: (d) => `. I remember this from ${d}.`,
    notFound: 'I don’t remember anything about that yet. Want to add it with "Remember something"?',
    notFoundSpeech: "I don't remember anything about that yet.",
    months: ["January","February","March","April","May","June","July","August","September","October","November","December"],
    stopwords: ['i','me','my','is','are','was','were','the','a','an','in','on','at','to','of','it','where','did','do','does','put','keep','kept','put','find','remember','that','this','and','also']
  }
};

let currentLang = localStorage.getItem(LANG_KEY) || 'hi';
function t() { return I18N[currentLang]; }

function loadMemories() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveMemories(list) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
}
function extractKeywords(text, lang) {
  const stopwords = new Set(I18N[lang].stopwords);
  return text.toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .split(/\s+/)
    .filter(w => w.length > 0 && !stopwords.has(w));
}
function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getDate()} ${t().months[d.getMonth()]} ${d.getFullYear()}`;
}

function applyTranslations() {
  document.documentElement.lang = t().htmlLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t()[el.dataset.i18n];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t()[el.dataset.i18nPlaceholder];
  });
  document.getElementById('langBtnHi').classList.toggle('active', currentLang === 'hi');
  document.getElementById('langBtnEn').classList.toggle('active', currentLang === 'en');
  document.getElementById('rememberStatus').textContent = t().rememberPrompt;
  document.getElementById('findStatus').textContent = t().findPrompt;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  applyTranslations();
  updateRecognitionLang();
  renderRecent();
  const activeScreen = document.querySelector('.screen.active').id;
  if (activeScreen === 'all') renderAll();
}

function goTo(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screen).classList.add('active');
  if (screen === 'home') renderRecent();
  if (screen === 'all') renderAll();
  if (screen === 'remember') { document.getElementById('rememberText').value=''; document.getElementById('rememberStatus').textContent=t().rememberPrompt; }
  if (screen === 'find') { document.getElementById('findText').value=''; document.getElementById('findResult').innerHTML=''; document.getElementById('findStatus').textContent=t().findPrompt; }
}

function renderRecent() {
  const list = loadMemories().slice().sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));
  const el = document.getElementById('recentList');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty-msg">${escapeHtml(t().emptyRecent)}</div>`;
    return;
  }
  const shown = list.slice(0,5);
  el.innerHTML = shown.map(m => `
    <div class="card memory-item">
      <button onclick="speak(${JSON.stringify(t().recallPrefix + m.text + t().recallSince(formatDate(m.timestamp)))})">
        ${escapeHtml(m.text)}
        <span class="memory-date">${formatDate(m.timestamp)}</span>
      </button>
    </div>`).join('');
  if (list.length > 5) {
    el.innerHTML += `<div class="card memory-item"><button onclick="goTo('all')">${escapeHtml(t().viewAll(list.length))}</button></div>`;
  }
}

function renderAll() {
  const list = loadMemories().slice().sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));
  const el = document.getElementById('allList');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty-msg">${escapeHtml(t().emptyAll)}</div>`;
    return;
  }
  el.innerHTML = list.map(m => `
    <div class="card memory-item">
      <button onclick="speak(${JSON.stringify(t().recallPrefix + m.text + t().recallSince(formatDate(m.timestamp)))})">
        ${escapeHtml(m.text)}
        <span class="memory-date">${formatDate(m.timestamp)}</span>
      </button>
    </div>`).join('') + `<button class="delete-link" onclick="confirmClearAll()">${escapeHtml(t().deleteAll)}</button>`;
}

function confirmClearAll() {
  if (confirm(t().confirmDeleteAll)) {
    saveMemories([]);
    renderAll();
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function speak(text) {
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = t().speechLang;
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }
  } catch (e) {}
}

function clearRemember() {
  document.getElementById('rememberText').value = '';
}
function clearFind() {
  document.getElementById('findText').value = '';
  document.getElementById('findResult').innerHTML = '';
}

function saveMemory() {
  const text = document.getElementById('rememberText').value.trim();
  if (!text) return;
  const list = loadMemories();
  list.push({ id: Date.now().toString(), text, timestamp: new Date().toISOString(), lang: currentLang, keywords: extractKeywords(text, currentLang) });
  saveMemories(list);
  document.getElementById('rememberStatus').textContent = t().savedStatus;
  speak(t().savedSpeech + text);
  setTimeout(() => goTo('home'), 900);
}

function doSearch() {
  const query = document.getElementById('findText').value.trim();
  const resultEl = document.getElementById('findResult');
  if (!query) return;
  const qWords = extractKeywords(query, currentLang);
  const list = loadMemories();
  let best = null, bestScore = 0;
  list.forEach(m => {
    const mKeywords = m.keywords || extractKeywords(m.text, m.lang || 'hi');
    let score = 0;
    qWords.forEach(w => {
      if (mKeywords.includes(w)) score += 2;
      else if (m.text.toLowerCase().includes(w)) score += 1;
    });
    if (score > bestScore) { bestScore = score; best = m; }
  });
  if (best && bestScore > 0) {
    const dateStr = formatDate(best.timestamp);
    resultEl.innerHTML = `<div class="result-box">${escapeHtml(best.text)}<span class="rdate">${escapeHtml(t().recallSince(dateStr).replace(/^\. ?/, ''))}</span></div>`;
    speak(best.text + t().recallSince(dateStr));
  } else {
    resultEl.innerHTML = `<div class="result-box" style="border-color:var(--amber)">${escapeHtml(t().notFound)}</div>`;
    speak(t().notFoundSpeech);
  }
}

let rememberRecognition, findRecognition;

function setupRecognition(micId, statusId, targetInputId, noSupportId, onFinal) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micEl = document.getElementById(micId);
  const statusEl = document.getElementById(statusId);
  const noSupportEl = document.getElementById(noSupportId);
  if (!SpeechRecognition) {
    noSupportEl.style.display = 'block';
    micEl.style.opacity = '0.4';
    return null;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = t().speechLang;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  micEl.addEventListener('click', () => {
    try {
      recognition.lang = t().speechLang;
      micEl.classList.add('listening');
      statusEl.textContent = t().listening;
      recognition.start();
    } catch (e) {}
  });
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    document.getElementById(targetInputId).value = transcript;
    statusEl.textContent = t().heard;
    if (onFinal) onFinal(transcript);
  };
  recognition.onerror = () => {
    statusEl.textContent = t().notUnderstood;
  };
  recognition.onend = () => {
    micEl.classList.remove('listening');
  };
  return recognition;
}

function updateRecognitionLang() {
  if (rememberRecognition) rememberRecognition.lang = t().speechLang;
  if (findRecognition) findRecognition.lang = t().speechLang;
}

rememberRecognition = setupRecognition('rememberMic', 'rememberStatus', 'rememberText', 'rememberNoSupport');
findRecognition = setupRecognition('findMic', 'findStatus', 'findText', 'findNoSupport', () => { doSearch(); document.getElementById('findStatus').textContent = t().heardFind; });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

applyTranslations();
renderRecent();
</script>
</body>
</html>
